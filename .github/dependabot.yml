version: 2
updates:
  - package-ecosystem: "github-actions"
    target-branch: "main"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    target-branch: "main"
    directory: "/"
    schedule:
      interval: "monthly"
    # Version updates off: the packages have no runtime dependencies, and the build and test tools
    # move on purpose. Security updates still open PRs (Dependabot security updates are separate).
    open-pull-requests-limit: 0
  - package-ecosystem: "composer"
    target-branch: "main"
    directory: "/integrations/wordpress/openpush"
    schedule:
      interval: "monthly"
    # The WordPress plugin's Composer packages are lint and test tools only; security updates only.
    open-pull-requests-limit: 0
